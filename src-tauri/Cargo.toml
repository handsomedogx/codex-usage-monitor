[package]
name = "codex-usage-monitor"
version = "0.1.1"
description = "A lightweight local Codex session usage monitor"
authors = ["Codex Usage Monitor"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.4"
uuid = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
