name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发只构建、不发布，用于在打 tag 之前先验证打包链路是否正常
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # tag 推送：构建并创建 GitHub Release
      - name: Build and publish
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex Usage Monitor ${{ github.ref_name }}"
          releaseBody: |
            ## Codex Usage Monitor ${{ github.ref_name }}

            ### 下载

            Windows 用户推荐下载 `setup.exe` 安装。

            ### 说明

            - 本地分析 Codex 使用量
            - 不上传会话日志
            - 支持 Token、请求数、模型及费用统计
          releaseDraft: false
          prerelease: false

      # 手动触发：只构建，不传 tagName 就不会创建 Release，产物可从 Actions artifacts 下载
      - name: Build only (manual run)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
